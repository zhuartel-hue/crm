<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logowanie · Sygnavo</title><link rel="stylesheet" href="/static/app.css"></head>
<body>{% if TEST_PANEL %}<div style="background:#b45309;color:#fff;text-align:center;font-size:12px;padding:3px 8px">PANEL TESTOWY · kopia danych</div>{% endif %}<main class="login"><div class="card">
<h1>Sygnavo</h1><p class="muted">Faktury i CRM</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login">
<p><label>E-mail</label><input name="login" autocomplete="username" inputmode="email" autocapitalize="none" required></p>
<p><label>Hasło</label><input name="password" type="password" autocomplete="current-password" required></p>
<button class="btn primary" style="width:100%">Zaloguj</button>
</form></div></main></body></html>
